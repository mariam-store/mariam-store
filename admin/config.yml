# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: mariam-store/mariam-store
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/d43afc68-7841-4866-b0d5-7100ca851bd8/pkce
  auth_token_endpoint: /sites/d43afc68-7841-4866-b0d5-7100ca851bd8/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://keen-frangollo-1794de.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "المنتجات"
    files:
      - file: "products.json"
        label: "قائمة المنتجات"
        name: "products"
        fields:
          - label: "المنتجات"
            name: "items"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}} ج.م"
            fields:
              - {label: "اسم المنتج", name: "name", widget: "string"}
              - label: "التصنيف"
                name: "cat"
                widget: "select"
                options: ["فساتين", "بلايز", "جاكيتات", "إكسسوارات"]
              - {label: "السعر (ج.م)", name: "price", widget: "number", value_type: "int"}
              - {label: "السعر قبل الخصم (اختياري)", name: "oldPrice", widget: "number", value_type: "int", required: false}
              - label: "شكل الأيقونة"
                name: "icon"
                widget: "select"
                options: ["dress", "blouse", "jacket", "knit", "abaya", "bag", "scarf", "belt"]
